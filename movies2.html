<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                    }
                }
            }
        }
    </script>

    <title>Seu Projeto Tailwind</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 20px 30px;
            min-height: 100dvh;
            background-color: #1d1a28;
            background-image:
                linear-gradient(rgba(29, 26, 40, 0.9), rgba(29, 26, 40, 0.98)),
                url(https://shop.haierindia.com/blog/wp-content/uploads/2025/05/Ideal-Viewing-Distance-for-LED-TV-1116x628.jpg.webp);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .list-container {
            z-index: 10;
            position: relative;
            overflow-x: hidden;
        }

        .card {
            z-index: 999;
            position: relative;

            border-radius: 1px;
            padding: 20px;
            width: 90%;
            min-height: 100px;

            background: #3f3b4d;
            -webkit-box-shadow: 0px 0px 50px 5px #1d1b2a;
            box-shadow: 0px 0px 50px 5px #1d1b2a;

            display: flex;
            gap: 10px;

            transition: 0.7s;
        }

        /* Base para os segmentos de borda */
        .card::before,
        .card::after {
            content: "";
            position: absolute;
            width: 50%;
            height: 50%;
            pointer-events: none;
            -webkit-mask-composite: source-in;
            /* Suporte para navegadores baseados em Webkit */
            mask-composite: intersect;
        }

        /* Segmento Superior Direito */
        .card::before {
            top: 0;
            right: 0;
            border-top: 1px solid gray;
            border-right: 1px solid gray;
            /* Cria o efeito de fade partindo do canto superior direito */
            mask-image:
                linear-gradient(to left, gray, transparent),
                linear-gradient(to bottom, gray, transparent);

            -webkit-box-shadow: inset 0 0 50px 0 #1d1b2a;
            box-shadow: inset 0 0 50px 0 #1d1b2a;
        }

        /* Segmento Inferior Esquerdo */
        .card::after {
            bottom: 0;
            left: 0;
            border-bottom: 1px solid gray;
            border-left: 1px solid gray;
            /* Cria o efeito de fade partindo do canto inferior esquerdo */
            mask-image:
                linear-gradient(to right, gray, transparent),
                linear-gradient(to top, gray, transparent);

            -webkit-box-shadow: inset 0 0 50px 0 #1d1b2a;
            box-shadow: inset 0 0 50px 0 #1d1b2a;
        }

        .card:hover {
            z-index: 1;
            transform: scale(1.1);
        }

        .card .selector {
            position: absolute;
            left: 0;
            /* Alinhado ao fundo do card */
            top: 30%;
            bottom: 30%;
            width: 4px;
            /* Espessura da linha */

            background: white;
            border-radius: 0 10px 10px 0;
            opacity: 0;

            /* Brilho (Glow) mais suave */
            box-shadow: 10px 0 20px 2px rgba(255, 255, 255, 0.7);

            /* Transição suave de subida */
            transform: translateX(-10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover .selector {
            opacity: 1;
            transform: translateX(0);
            /* Sobe para a posição original ao dar hover */
        }

        .profile-btn {
            background-image:
                linear-gradient(rgba(222, 5, 52, 0.5), rgba(222, 5, 52, 0.5)),
                url(https://www.svgrepo.com/show/486506/user-profile-filled.svg);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .content-cover {
            padding: 10px;
            width: 100px;
            background: #1d1b2a;
            object-fit: cover;
        }

        .tags {
            margin-top: 20px;
            display: flex;
            gap: 5px;
        }

        .tags span {
            font-size: 12px;
            font-weight: bold;
            padding: 1px 5px;
            color: #333;
        }

        .content-previewer {
            flex: 0.7;
            position: relative;
        }

        .content-previewer::before {
            content: "";
            z-index: 99;
            position: absolute;
            inset: 0;
            box-shadow: inset 20px 90px 50px 70px rgba(0, 0, 0, 0.7);
        }

        .cover {
            width: 100;
            height: 100%;
        }

        @media (max-width: 670px) {
            body {
                min-height: calc(100dvh + 60px);
                padding-top: 60px;
            }

            main {
                flex-direction: column;
            }

            .list-container {
                height: 50vh;
            }

            .content-previewer {
                bottom: 10px;
            }
        }
    </style>

    <link rel="icon" type="image/svg+xml" href="alpha.svg">
</head>

<body class="text-gray-200">
    <header class="mb-[20px] flex items-center">
        <img src="alpha.svg" alt="alpha.svg" width="80px">
        <p class="font-semibold text-gray-400">IPTV</p>
        <div class="ml-auto flex items-center gap-2">
            <button class="rounded-full p-2 bg-gray-700 flex">
                <span class="material-symbols-outlined">search</span>
            </button>
            <button class="profile-btn rounded-full w-[45px] h-[45px] bg-gray-700"></button>
        </div>
    </header>

    <main class="flex-1 flex justify-end">
        <div class="list-container">
            <div class="p-[10px_0] flex flex-col items-center gap-5">
                <button class="card">
                    <img class="content-cover"
                        src="https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p18363429_p_v13_aa.jpg"
                        alt="">
                    <div class="flex flex-col items-start">
                        <p class="text-[18px] font-bold text-start">Superman: Man Of Tomorrow</p>
                        <p class="text-[12px] text-gray-400">Watched</p>
                        <div class="tags">
                            <span class="bg-gray-200">4K</span>
                            <span class="bg-gray-200">LEG</span>
                            <span class="bg-gray-200">ACTION</span>
                        </div>
                    </div>
                    <div class="selector bg-white"></div>
                </button>
                <button class="card">
                    <img class="content-cover"
                        src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/cheo9jDPfyW1GevfPjXtnO91KNe.jpg" alt="">
                    <div class="flex flex-col items-start">
                        <p class="text-[18px] font-bold text-start">Man Of Steel</p>
                        <p class="text-[12px] text-gray-400">Watched</p>
                        <div class="tags">
                            <span class="bg-gray-200">4K</span>
                            <span class="bg-gray-200">DUB</span>
                            <span class="bg-gray-200">ACTION</span>
                        </div>
                    </div>
                    <div class="selector bg-white"></div>
                </button>
                <button class="card">
                    <img class="content-cover"
                        src="https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p18363429_p_v13_aa.jpg"
                        alt="">
                    <div class="flex flex-col items-start">
                        <p class="text-[18px] font-bold text-start">Superman: Man Of Tomorrow</p>
                        <p class="text-[12px] text-gray-400">Watched</p>
                        <div class="tags">
                            <span class="bg-gray-200">4K</span>
                            <span class="bg-gray-200">ACTION</span>
                        </div>
                    </div>
                    <div class="selector bg-white"></div>
                </button>
            </div>
        </div>

        <div class="content-previewer">
            <img class="cover"
                src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/cheo9jDPfyW1GevfPjXtnO91KNe.jpg" alt="">
        </div>
    </main>

    <script>
        // Scroll to body bottom
        window.scrollTo(0, document.body.scrollHeight);
    </script>
</body>

</html>
